<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Asistent panel preview</title>
  <!-- Development only. The real panel markup, style and code, with fake Premiere and engine modules (boot.js).
       Open as /preview/index.html?s=<scenario>; shoot.js takes the screenshots. Chrome is not UXP: the final
       check is always in Premiere. -->
  <link rel="stylesheet" href="../panel/style.css">
  <style>
    /* UXP uses the host's UI font; the browser gets the closest system font */
    body { font-family: -apple-system, BlinkMacSystemFont, "Adobe Clean", "Segoe UI", sans-serif; }
    /* UXP draws its own dark Spectrum fields; Chrome's white ones would hide how the panel really looks */
    select, textarea, input:not([type="checkbox"]) { background-color: #1b1b1b; color: #ddd; border: 1px solid #4a4a4a;
      border-radius: 4px; font-family: inherit; }
    select { padding: 2px 4px; }
    textarea, input:not([type="checkbox"]) { padding: 4px 6px; }
    input[type="checkbox"] { accent-color: #2d5fa8; }
  </style>
</head>
<body>
  <script src="scenarios.js"></script>
  <script src="boot.js"></script>
</body>
</html>
